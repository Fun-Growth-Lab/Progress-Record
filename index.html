<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4edd8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="研究進捗">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png" type="image/png">
<title>研究進捗アプリ</title>
<style>
:root{
  color-scheme:light;
  --bg:#fdf6e3; --card:#f4edd8; --card2:#e8e0c8; --field:#fdf6e3;
  --ink:#073642; --sub:#51666c; --line:#d3cbb0;
  --pri:#1f6ca5; --pri-d:#1a5c8c; --pri-l:rgba(31,108,165,.16); --on-pri:#ffffff;
  --ok:#606e00; --ok-l:rgba(96,110,0,.16);
  --warn:#836400; --warn-l:rgba(131,100,0,.16);
  --bad:#cb2e2b; --bad-l:rgba(203,46,43,.16); --bad-fill:#cb2e2b;
  --gray:#51666c; --gray-l:#e8e0c8;
  --purple:#6064ad; --purple-l:rgba(96,100,173,.16); --on-ok:#ffffff; --dim:#96a09c; --shadow:rgba(30,40,70,.28);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --tab:54px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
  font-size:15px;line-height:1.5;font-feature-settings:"palt" 1;-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
[hidden]{display:none!important}
svg{display:block}

#app{position:relative;height:100vh;height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
.top{flex:none;display:flex;align-items:center;gap:4px;min-height:52px;padding:calc(6px + env(safe-area-inset-top)) 6px 6px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.top .tw{flex:1;min-width:0}
.top h1{margin:0;font-size:20px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .st{font-size:12px;color:var(--sub);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top.sh{padding-left:4px}
.top.sh h1{font-size:17px}
.icon-btn{flex:none;width:40px;height:40px;border-radius:10px;color:var(--sub);display:flex;align-items:center;justify-content:center}
.icon-btn:active{background:var(--card2)}
#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 84px}
#tabbar{flex:none;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabbar button{position:relative;flex:1;height:var(--tab);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--dim);font-size:10.5px;font-weight:600}
#tabbar button.on{color:var(--pri)}
.badge{position:absolute;top:4px;left:calc(50% + 5px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--bad-fill);color:#fff;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
.fab{position:absolute;right:16px;bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 14px);width:52px;height:52px;border-radius:26px;background:var(--pri);color:var(--on-pri);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px var(--shadow)}
.fab:active{background:var(--pri-d)}

/* ---- リスト ---- */
.gh{display:flex;align-items:baseline;gap:6px;margin:16px 4px 6px;font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.03em}
.gh .n{font-weight:500;color:var(--dim)}
.gh.over{color:var(--bad)} .gh.today{color:var(--warn)}
.list{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.list>*+*{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px;width:100%;min-height:50px;padding:9px 10px 9px 12px;text-align:left;color:var(--ink)}
.row:active{background:var(--card2)}
.row.static:active{background:none}
.row .rb{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row .rt{font-size:15px;font-weight:600;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.row .rm{font-size:12px;color:var(--sub);display:flex;flex-wrap:wrap;align-items:center}
.row .rm>*+*::before{content:"·";margin:0 5px;color:var(--dim);font-weight:400}
.row>svg{flex:none;color:var(--dim)}
.due{font-weight:500}.due .dl{margin-left:6px;font-weight:700}.due.over{color:var(--bad)}.due.today,.due.soon{color:var(--warn)}
.row.mine{box-shadow:inset 3px 0 0 var(--pri)}
.row .rm>.me-tag::before{content:none}
.row .rm>.me-tag{margin-left:6px}
.me-tag{display:inline-block;height:17px;line-height:17px;padding:0 6px;border-radius:9px;font-size:11px;font-weight:700;color:var(--pri);background:var(--pri-l)}
.dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--pri)}
.dot.over{background:var(--bad)}.dot.today,.dot.soon{background:var(--warn)}.dot.done{background:var(--ok)}.dot.dropped{background:var(--dim)}
.dot.none{background:transparent;box-shadow:inset 0 0 0 1.5px var(--dim)}
.new{font-size:10px;font-weight:800;background:var(--bad-fill);color:#fff;padding:1px 6px;border-radius:8px;margin-left:6px;vertical-align:1px}
.av{flex:none;width:32px;height:32px;border-radius:16px;background:var(--pri-l);color:var(--pri);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.av.lg{width:44px;height:44px;border-radius:22px;font-size:18px}
.un{flex:none;background:var(--bad-fill);color:#fff;font-size:11px;font-weight:800;border-radius:9px;min-width:18px;height:18px;padding:0 5px;display:flex;align-items:center;justify-content:center}
.cnt{font-size:12px;color:var(--sub)}
.empty{text-align:center;color:var(--sub);padding:32px 12px;font-size:13px;line-height:1.6}
.empty b{display:block;font-size:15px;color:var(--ink);margin-bottom:2px}
.linkb{font-size:12px;color:var(--pri);font-weight:600;padding:6px 8px}

/* ---- セグメント・チップ ---- */
.seg{display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:2px}
.seg button{flex:1;height:30px;border-radius:8px;font-size:13px;font-weight:600;color:var(--sub)}
.seg button .c{font-weight:500;color:var(--dim);margin-left:3px}
.seg button.on{background:var(--pri-l);color:var(--pri)}
.seg button.on .c{color:var(--pri)}
.chips{scrollbar-width:none;display:flex;gap:6px;overflow-x:auto;margin:0 -12px 8px;padding:0 12px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;height:32px;padding:0 13px;border:1px solid var(--line);border-radius:16px;background:var(--card);font-size:13px;font-weight:600;color:var(--sub)}
.chips button.on{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}

/* ---- フォーム ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
label.l{display:block;font-size:12px;font-weight:700;color:var(--sub);margin:12px 2px 5px}
.inp{display:block;width:100%;font:inherit;font-size:16px;line-height:1.35;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink);min-height:44px;-webkit-appearance:none;appearance:none}
.inp::placeholder{color:var(--dim)}
.inp:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-l)}
textarea.inp{min-height:76px;resize:vertical}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);background-position:calc(100% - 19px) 50%,calc(100% - 14px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:46px;border-radius:12px;background:var(--pri);color:var(--on-pri);font-size:15px;font-weight:700;padding:0 18px}
.btn:active{filter:brightness(.92)}
.btn:disabled{opacity:.5}
.btn.ok{background:var(--ok);color:var(--on-ok)} .btn.bad{background:var(--bad-fill);color:#fff}
.btn.ghost{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}
.btn.ghost.bad{color:var(--bad);border-color:var(--bad)}
.btn.gray{background:var(--card2);color:var(--ink)}
.btn.sm{min-height:34px;font-size:13px;width:auto;padding:0 13px;border-radius:9px}
.row2{display:flex;gap:8px;margin-top:10px}.row2>*{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2>*{min-width:0}
.quick{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.quick button{height:30px;padding:0 12px;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:15px;font-size:12.5px;font-weight:600}
.err{color:var(--bad);font-size:13px;font-weight:600;margin:8px 2px 0}
.hint{color:var(--sub);font-size:12px;line-height:1.55}
.chk{display:flex;align-items:center;gap:8px;margin:12px 2px 0;font-size:14px;color:var(--sub);cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--pri);margin:0}

/* ---- シート（全画面） ---- */
#sheet{position:fixed;left:0;right:0;top:0;height:100vh;height:100dvh;z-index:50;background:var(--bg)}
.sheet-in{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:var(--bg)}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px calc(28px + env(safe-area-inset-bottom))}
.dt-t{font-size:20px;font-weight:700;line-height:1.35;word-break:break-word;margin:2px 2px 8px}
.dt-tags{display:flex;gap:6px;flex-wrap:wrap;margin:0 2px 12px}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:11px;font-size:12px;font-weight:700;background:var(--card2);color:var(--sub)}
.pill.over{background:var(--bad-l);color:var(--bad)} .pill.today,.pill.soon{background:var(--warn-l);color:var(--warn)}
.pill.ok,.pill.open{background:var(--pri-l);color:var(--pri)} .pill.done{background:var(--ok-l);color:var(--ok)} .pill.dropped{background:var(--card2);color:var(--sub)}
.pill.open{background:var(--pri-l)}
.prow{display:flex;align-items:center;gap:10px;padding:9px 12px;font-size:14px}
.prow span{flex:none;width:44px;font-size:12px;color:var(--sub)}
.prow b{font-weight:600}
.detail{white-space:pre-wrap;word-break:break-word;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px}
.tl{display:flex;gap:10px;padding:10px 12px}
.tl-d{flex:none;width:40px;font-size:12px;font-weight:600;color:var(--sub);font-variant-numeric:tabular-nums;padding-top:1px}
.tl-b{flex:1;min-width:0}
.tl-b .nm{font-size:13px;font-weight:700}
.tl-b .tx,.ent .tx{white-space:pre-wrap;word-break:break-word;margin-top:2px;font-size:14px}
.k{display:inline-block;padding:0 7px;height:18px;line-height:18px;border-radius:9px;font-size:11px;font-weight:700;margin-right:6px;vertical-align:1px}
.k-note{background:var(--pri-l);color:var(--pri)} .k-done{background:var(--ok-l);color:var(--ok)} .k-drop{background:var(--card2);color:var(--sub)}
.k-create,.k-reopen,.k-assign,.k-due{background:var(--purple-l);color:var(--purple)}
.k-memo{background:var(--warn-l);color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)}
.k-tk{background:var(--pri-l);color:var(--pri);box-shadow:inset 0 0 0 1px var(--pri)}
.comp-row{display:flex;gap:8px;margin-top:8px}
.comp-row .inp{flex:1;min-width:0}
.comp-row .btn{width:88px;flex:none}

/* ---- 記録 ---- */
.datebar{display:flex;gap:4px;align-items:center;margin-bottom:8px}
.datebar .inp{flex:1;text-align:center;font-weight:700;min-width:0}
.ent{display:flex;gap:10px;padding:10px 12px}
.ent .et{flex:none;width:40px;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;padding-top:1px}
.ent .eb{flex:1;min-width:0}
.ent .eh{font-size:13px;display:flex;align-items:center;flex-wrap:wrap;gap:2px}
.ent .eh b{font-weight:700;margin-right:4px}
.ent .eh .acts,.tl-b .eh .acts{margin-left:auto;display:flex}
.tl-b .eh{display:flex;align-items:center;flex-wrap:wrap;gap:2px}
.tl-b .eh .nm{margin-right:4px}
.linkb.del{color:var(--bad)}
.edtag{font-size:11px;font-weight:600;color:var(--sub);background:var(--card2);border-radius:9px;height:18px;padding:0 7px;margin-right:2px}
.ctl{display:grid;grid-template-columns:auto 1fr;gap:8px;margin-bottom:2px}
.ctl .seg{margin-bottom:0}
.ctl .seg:first-child button{padding:0 14px}
.gh-day{width:100%;text-align:left;position:sticky;top:0;z-index:3;margin:0 !important;padding:12px 4px 6px;background:var(--bg)}
.gh-day .today{font-size:11px;font-weight:700;color:var(--pri);background:var(--pri-l);border-radius:9px;padding:0 7px}
.gh-day .go{margin-left:auto;color:var(--dim)}
.hist{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;background:var(--card)}
.hist .hh{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:2px}
.hist .hh .by{font-weight:500;color:var(--dim)}
.hist .tx{white-space:pre-wrap;word-break:break-word;font-size:14px}
.ent a.tk{cursor:pointer;display:block;margin-top:2px;font-size:14px;font-weight:600;color:var(--pri)}

/* ---- 連絡 ---- */
.msgs{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 6px;display:flex;flex-direction:column;gap:4px}
.dsep{align-self:center;background:var(--card2);color:var(--sub);font-size:11px;font-weight:700;border-radius:10px;padding:1px 10px;margin:8px 0 2px}
.msg{max-width:82%;display:flex;flex-direction:column}
.msg .bub{padding:7px 12px;border-radius:16px;white-space:pre-wrap;word-break:break-word;background:var(--card2);border:1px solid var(--line);font-size:14.5px;line-height:1.45}
.msg .info{font-size:11px;color:var(--sub);margin:0 6px 1px}
.msg.me{align-self:flex-end;align-items:flex-end}.msg.me .bub{background:var(--pri);color:var(--on-pri);border-color:var(--pri);border-bottom-right-radius:5px;font-weight:600}
.msg.you{align-self:flex-start}.msg.you .bub{border-bottom-left-radius:5px}
.msg.pending{opacity:.6}
.composer{flex:none;display:flex;gap:8px;align-items:flex-end;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
.composer textarea{flex:1;min-height:44px;max-height:120px;resize:none;padding:10px 12px}
.composer .btn{width:auto;min-width:64px;min-height:44px}

/* ---- 設定 ---- */
.acc{display:flex;align-items:center;gap:12px}
.acc .rb{flex:1;min-width:0;display:flex;flex-direction:column}
.acc b{font-size:17px;font-weight:700;line-height:1.3}
.acc span.t{font-size:12px;color:var(--sub)}
.themes{display:flex;gap:8px;overflow-x:auto;margin:0 -12px;padding:2px 12px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.themes::-webkit-scrollbar{display:none}
.theme{flex:none;width:124px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:9px 10px;border:2px solid;border-radius:12px;text-align:left}
.theme.on{padding:7px 8px;border-width:4px}
.theme .tn{font-size:14px;font-weight:700;line-height:1.3}
.theme .ts{font-size:10.5px;line-height:1.3}
.theme .dots{display:flex;gap:5px;margin-top:6px}
.theme .dots i{width:14px;height:14px;border-radius:7px;border:1px solid rgba(128,128,128,.45)}

/* ---- 管理者 ---- */
.tsw{display:flex;align-items:center;gap:3px;max-width:100%;padding:2px 4px 2px 0;font-size:20px;font-weight:700;line-height:1.25;color:var(--ink);text-align:left}
.tsw-n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tsw svg{flex:none;color:var(--pri)}
.dlg.pick{max-height:82vh}
.dlg.pick .row .ck{flex:none;color:var(--pri);display:flex}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px}
.stats>div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.stats b{display:block;font-size:22px;font-weight:700;line-height:1.2}
.stats span{font-size:12px;color:var(--sub)}
.stats .bad b{color:var(--bad)}
.abadge{display:inline-block;height:17px;line-height:17px;padding:0 6px;margin-left:5px;border-radius:9px;font-size:10px;font-weight:800;letter-spacing:.03em;background:var(--purple);color:var(--bg);vertical-align:1px}
.tag{display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:9px;font-size:11px;font-weight:700;background:var(--card2);color:var(--sub);margin-left:6px}

/* 明るいテーマ：iPhoneのステータスバー（白文字）が読めるよう、ノッチ部分だけ暗くする */
:root[data-scheme="light"]::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:#0b1120;z-index:200}

/* ---- ダイアログ・トースト ---- */
#modal{position:fixed;inset:0;z-index:90;background:rgba(2,6,16,.66);display:flex;align-items:flex-end;justify-content:center}
.dlg{width:100%;max-width:560px;background:var(--card2);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto}
.dlg h2{margin:0 0 2px;font-size:17px;font-weight:700}
.dlg .hint{white-space:pre-line}
#toast{position:fixed;left:50%;width:max-content;bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 76px);transform:translateX(-50%);z-index:100;background:var(--card2);color:var(--ink);border:1px solid var(--pri);font-size:14px;font-weight:600;padding:9px 16px;border-radius:20px;max-width:88vw;text-align:center;box-shadow:0 6px 18px var(--shadow)}

/* ---- ログイン・登録（1画面1項目） ---- */
.ob{width:100%;min-height:100vh;min-height:100dvh;max-width:420px;margin:0 auto;padding:calc(6px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
.ob-top{display:flex;align-items:center;justify-content:space-between;min-height:44px;margin:0 -8px}
.ob-top .step{font-size:12px;font-weight:700;color:var(--sub);padding-right:8px;letter-spacing:.05em}
.ob-body{flex:1;display:flex;flex-direction:column}
.ob-h{font-size:22px;font-weight:700;line-height:1.3;margin:18px 0 14px}
.brand{display:flex;flex-direction:column;align-items:center;gap:8px;margin:9vh 0 26px}
.brand .logo{width:52px;height:52px;border-radius:13px}
.brand h1{margin:0;font-size:20px;font-weight:700}
.brand p{margin:0;font-size:12px;color:var(--sub)}
.foot-links{display:flex;justify-content:center;gap:16px;margin-top:22px}
.foot-links button{font-size:12px;color:var(--sub);text-decoration:underline;padding:6px}
.radio{flex:none;width:18px;height:18px;border-radius:9px;border:2px solid var(--dim)}
.row.sel{background:var(--pri-l)}
.row.sel .radio{border-color:var(--pri);background:var(--pri);box-shadow:inset 0 0 0 3px var(--card)}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet" hidden></div>
<div id="modal" hidden></div>
<div id="toast" hidden></div>

<script>
'use strict';
/* ============================================================
   設定：Supabase の「Project URL」と「publishable key」をここに貼る
   （Mathgames と同じ方式：SDKなし・fetchでREST直接呼び出し）
   ============================================================ */
const CONFIG = {
    url: 'https://qbikxhyyjyszufxfftpu.supabase.co',
    key: 'sb_publishable_VydNuxSc9T6Ek40N6sydsw_-6WBYZ8d'

/* SHA-256（パスワードはハッシュにして送る。HTTPヘッダに日本語を載せられないため） */
function sha256js(bytes){
    const isPrime = n => { for (let i = 2; i * i <= n; i++) if (n % i === 0) return false; return true; };
    const K = [], H = [];
    for (let n = 2; K.length < 64; n++) if (isPrime(n)) {
        if (H.length < 8) H.push((Math.pow(n, 1 / 2) % 1) * 4294967296 | 0);
        K.push((Math.pow(n, 1 / 3) % 1) * 4294967296 | 0);
    }
    const len = bytes.length, total = ((len + 9 + 63) >> 6) << 6;
    const buf = new Uint8Array(total); buf.set(bytes); buf[len] = 0x80;
    const dv = new DataView(buf.buffer);
    dv.setUint32(total - 8, Math.floor(len * 8 / 4294967296)); dv.setUint32(total - 4, (len * 8) >>> 0);
    const w = new Int32Array(64), rr = (x, n) => (x >>> n) | (x << (32 - n));
    for (let o = 0; o < total; o += 64) {
        for (let i = 0; i < 16; i++) w[i] = dv.getInt32(o + i * 4);
        for (let i = 16; i < 64; i++) {
            const s0 = rr(w[i - 15], 7) ^ rr(w[i - 15], 18) ^ (w[i - 15] >>> 3);
            const s1 = rr(w[i - 2], 17) ^ rr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
            w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
        }
        let [a, b, c, d, e, f, g, h] = H;
        for (let i = 0; i < 64; i++) {
            const t1 = (h + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
            const t2 = ((rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
            h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
        }
        const add = [a, b, c, d, e, f, g, h];
        for (let i = 0; i < 8; i++) H[i] = (H[i] + add[i]) | 0;
    }
    return H.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
}
async function sha256hex(str){
    const data = new TextEncoder().encode(str);
    if (window.crypto && crypto.subtle) {
        try { const b = await crypto.subtle.digest('SHA-256', data); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); } catch (e){}
    }
    return sha256js(data);
}

/* ---------- Supabase REST（Mathgamesと同じ：fetchで直接） ---------- */
const API = {
    async req(method, path, { query = '', body, prefer, retry = 0 } = {}){
        const headers = {
            'apikey': CONFIG.key,
            'Authorization': 'Bearer ' + CONFIG.key,
            'x-lab-pass': S.pass || '',
            ...(S.admin ? { 'x-lab-admin': S.admin } : {}),
            'Content-Type': 'application/json'
        };
        if (prefer) headers['Prefer'] = prefer;
        let res;
        try {
            res = await fetch(`${CONFIG.url.replace(/\/$/, '')}/rest/v1/${path}${query ? '?' + query : ''}`,
                { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
        } catch (e) {
            const err = new Error('通信できません。電波を確認してください'); err.net = true; throw err;
        }
        const text = await res.text();
        let json = null; try { json = text ? JSON.parse(text) : null; } catch (e){}
        if (!res.ok) {
            const err = new Error((json && json.message) || `通信エラー (${res.status})`);
            err.status = res.status; err.code = json && json.code; throw err;
        }
        return json;
    },
    q(params){ return Object.entries(params).map(([k, v]) => `${k}=${encodeURIComponent(v)}`).join('&'); },
    list(table, params){ return this.req('GET', table, { query: this.q(params) }); },
    /* 1000件の上限を超えても全件取る */
    async all(table, params){
        const out = []; const PAGE = 1000;
        for (let off = 0; ; off += PAGE) {
            const rows = await this.list(table, { ...params, limit: PAGE, offset: off });
            out.push(...rows);
            if (rows.length < PAGE) break;
        }
        return out;
    },
    insert(table, row, returning){
        return this.req('POST', table, { body: row, prefer: returning ? 'return=representation' : 'return=minimal' });
    },
    patch(table, id, obj){ return this.req('PATCH', table, { query: `id=eq.${encodeURIComponent(id)}`, body: obj, prefer: 'return=minimal' }); },
    patchWhere(table, params, obj){ return this.req('PATCH', table, { query: this.q(params), body: obj, prefer: 'return=minimal' }); },
    delWhere(table, params){ return this.req('DELETE', table, { query: this.q(params), prefer: 'return=minimal' }); },
    del(table, id){ return this.req('DELETE', table, { query: `id=eq.${encodeURIComponent(id)}`, prefer: 'return=minimal' }); },
    rpc(name){ return this.req('POST', 'rpc/' + name, { body: {} }); }
};

async function submitReg(){

    const team = isNew ? ($('#rTeam') ? $('#rTeam').value.trim() : '') : OB.team;

/* ---------- タスク一覧（期限ごとにグループ化） ---------- */
function dueInfo(t){
    if (t.status === 'done') return { cls: 'done' };
    if (t.status === 'dropped') return { cls: 'dropped' };
    if (!t.due_date) return { cls: 'none' };
    const d = diffDays(t.due_date, today());
    return { cls: d < 0 ? 'over' : d === 0 ? 'today' : d <= 3 ? 'soon' : 'ok' };
}
/* 期限の日付に添える言葉：期限切れ（○日）／今日まで／あと○日 */
function dueLabel(t){
    if (t.status !== 'open' || !t.due_date) return '';
    const d = diffDays(t.due_date, today());
    return d < 0 ? `期限切れ（${-d}日）` : d === 0 ? '今日まで' : `あと${d}日`;
}
function dueText(t){
    if (t.status === 'done') return `完了 ${t.closed_date ? fmtM(t.closed_date) : ''}`;
    if (t.status === 'dropped') return `破棄 ${t.closed_date ? fmtM(t.closed_date) : ''}`;
    if (!t.due_date) return '';
    return `${fmtMD(t.due_date)} ${dueLabel(t)}`;
}
const GROUPS = [['over', '期限切れ'], ['today', '今日'], ['week', '7日以内'], ['later', 'それ以降'], ['none', '期限なし']];
function dueGroup(t){
    if (!t.due_date) return 'none';
    const d = diffDays(t.due_date, today());
    return d < 0 ? 'over' : d === 0 ? 'today' : d <= 7 ? 'week' : 'later';
}
function sortTasks(list, status){
    if (status === 'open') {
        return list.slice().sort((a, b) => {
            const ad = a.due_date || '9999-99-99', bd = b.due_date || '9999-99-99';
            return ad < bd ? -1 : ad > bd ? 1 : (a.created_at < b.created_at ? 1 : -1);
        });
    }
    return list.slice().sort((a, b) => (b.closed_at || b.created_at) > (a.closed_at || a.created_at) ? 1 : -1);
}
function taskRow(t, showWho){
    const di = dueInfo(t);
    const txt = dueText(t);
    const mine = t.assignee_id === S.me.id;
    const who = mine ? '<span class="me-tag">自分</span>' : `<span>${nameH(t.assignee_id)}</span>`;
    const lab = dueLabel(t);
    const dueHTML = t.status === 'open' && t.due_date ? `<span class="due ${di.cls}">${fmtMD(t.due_date)}<span class="dl">${esc(lab)}</span></span>` : (txt ? `<span class="due">${esc(txt)}</span>` : '');
    const meta = [dueHTML, showWho ? who : ''].filter(Boolean).join('');
    return `<button class="row ${mine ? 'mine' : ''}" data-act="openTask" data-id="${t.id}"><span class="dot ${di.cls === 'ok' ? '' : di.cls}"></span>
        <span class="rb"><span class="rt">${esc(t.title)}${S.newIds.has(t.id) ? '<span class="new">NEW</span>' : ''}</span>${meta ? `<span class="rm">${meta}</span>` : ''}</span>${svg('chev', 16)}</button>`;
}
function emptyMsg(){
    return { open: IS_ADMIN() ? '<b>タスクはありません</b>' : '<b>タスクはありません</b>右下の＋から追加できます', done: '<b>完了したタスクはありません</b>', dropped: '<b>破棄したタスクはありません</b>' }[S.taskStatus];
}
function taskListHTML(list, showWho){
    if (!list.length) return `<div class="empty">${emptyMsg()}</div>`;
    if (S.taskStatus !== 'open') return `<div class="list" style="margin-top:10px">${sortTasks(list, S.taskStatus).map(t => taskRow(t, showWho)).join('')}</div>`;
    const sorted = sortTasks(list, 'open');
    return GROUPS.map(([g, label]) => {
        const items = sorted.filter(t => dueGroup(t) === g);
        return items.length ? `<div class="gh ${g}">${label}<span class="n">${items.length}</span></div><div class="list">${items.map(t => taskRow(t, showWho)).join('')}</div>` : '';
    }).join('');
}
function segHTML(list){
    const c = { open: 0, done: 0, dropped: 0 }; list.forEach(t => c[t.status]++);
    const b = (v, l) => `<button data-act="status" data-v="${v}" class="${S.taskStatus === v ? 'on' : ''}">${l}<span class="c">${c[v]}</span></button>`;
    return `<div class="seg">${b('open', '進行中')}${b('done', '完了')}${b('dropped', '破棄')}</div>`;
}
function viewTasksAdmin(){

        return `${chips}${!S.at.loaded ? '<div class="empty">読み込み中…</div>' : rows ? `<div class="gh" style="margin-top:4px">全チーム<span class="n">${S.at.teams.filter(t => t.name).length}</span></div><div class="list">${rows}</div>` : '<div class="empty"><b>チームはありません</b>「設定」→「チーム管理」から作成できます</div>'}`;
    }
    const open = S.tasks.filter(t => t.status === 'open'), over = open.filter(t => t.due_date && t.due_date < today());
    const stats = `<div class="stats" style="margin-bottom:8px"><div><b>${open.length}</b><span>進行中</span></div><div class="${over.length ? 'bad' : ''}"><b>${over.length}</b><span>期限切れ</span></div><div><b>${S.tasks.filter(t => t.status === 'done').length}</b><span>完了</span></div></div>`;
    return `${chips}${stats}${segHTML(S.tasks)}${taskListHTML(S.tasks.filter(t => t.status === S.taskStatus), true)}`;
}
function viewTasks(){

    return `${scope}${segHTML(base)}${taskListHTML(base.filter(t => t.status === S.taskStatus), true)}`;
}

/* ---------- きろく（日付ごと） ---------- */
/* 記録の編集ツール（編集・削除・「編集済」）。type は 'note'（メモ）または 'log'（タスクの進捗） */
const EDITABLE = ['note', 'done', 'drop'];
function recTools(rec, type){
    const edited = (rec.edit_history || []).length;
    const own = rec.member_id === S.me.id;
    const canEdit = own && (type === 'note' || EDITABLE.includes(rec.kind));

const MEMO_SPAN = { day: 1, week: 7, month: 30 };

function viewMemo(){

const KIND = { create: '作成', note: '進捗', done: '完了', drop: '破棄', reopen: '再開', assign: '担当変更', due: '期限変更' };
async function loadMemo(){

    const who = inMembers();
    try {
        const [notes, logs] = await Promise.all([
            API.all('lab_notes', { member_id: who, and: `(note_date.gte.${from},note_date.lte.${to})`, order: 'created_at.asc' }),
            API.all('lab_logs', { member_id: who, and: `(log_date.gte.${from},log_date.lte.${to})`, order: 'created_at.asc' })
        ]);
        const [f2, t2] = memoRange(); if (key !== f2 + '|' + t2) return;

        if (S.tab === 'memo') softRender();
    } catch (e) { handleErr(e, true); }

async function delMemo(id){

/* ---------- 記録の編集（変更前の内容は履歴に残す） ---------- */
const recLists = type => type === 'note' ? [S.memoData.notes] : [S.memoData.logs, ...Object.values(S.logs)];
function findRec(type, id){ for (const l of recLists(type)) { const r = l.find(x => x.id === id); if (r) return r; } return null; }
function applyRec(type, id, patch){ recLists(type).forEach(l => l.forEach(r => { if (r.id === id) Object.assign(r, patch); })); }
async function editRec(type, id){
    const rec = findRec(type, id); if (!rec) return;
    const dk = type === 'note' ? 'note_date' : 'log_date';
    const r = await askBox({ title: '記録を編集', desc: '変更前の内容は履歴に残ります。', text: rec.body, required: type === 'note', placeholder: '内容', date: rec[dk], dateLabel: '日付', ok: '保存' });
    if (!r) return;
    if (r.text === rec.body && r.date === rec[dk]) return;
    const hist = [...(rec.edit_history || []), { at: new Date().toISOString(), by: S.me.id, body: rec.body, date: rec[dk] }];
    const table = type === 'note' ? 'lab_notes' : 'lab_logs';
    const patch = { body: r.text, [dk]: r.date, edit_history: hist };
    let noHist = false;
    try {
        try { await API.patch(table, id, patch); }
        catch (e) {   // 履歴用のSQL（edit_history列）を未実行でも、編集そのものはできるようにする
            if (!/edit_history/.test(e.message || '')) throw e;
            delete patch.edit_history; await API.patch(table, id, patch);
            noHist = true; toast('保存しました（履歴用のSQLが未実行のため、変更前の内容は残りません）', 6000);
        }
    } catch (e) { handleErr(e); return; }
    applyRec(type, id, patch);
    Object.values(S.logs).forEach(l => l.sort((a, b) => a.log_date < b.log_date ? 1 : a.log_date > b.log_date ? -1 : (a.created_at < b.created_at ? 1 : -1)));
    if (S.sheets.length) renderSheet(); else render();
    loadMemo();
    if (!noHist) toast('保存しました');
}
function showHistory(type, id){
    const rec = findRec(type, id); if (!rec) return;
    const dk = type === 'note' ? 'note_date' : 'log_date';
    const hist = [...(rec.edit_history || [])].reverse();
    const m = $('#modal'); m.hidden = false;
    m.innerHTML = `<div class="dlg"><h2>編集履歴</h2><p class="hint" style="margin:0 0 8px">変更前の内容が残っています。</p>
      <div class="hist"><div class="hh">現在<span>${fmtMD(rec[dk])}</span></div><div class="tx">${esc(rec.body) || '（内容なし）'}</div></div>
      ${hist.map(h => `<div class="hist"><div class="hh">変更前<span>${fmtMD(h.date)}</span><span class="by">${fmtMD(isoDate(h.at))} ${fmtHM(h.at)} ${esc(memName(h.by))}が変更</span></div><div class="tx">${esc(h.body) || '（内容なし）'}</div></div>`).join('')}
      <div style="height:12px"></div><button class="btn gray" id="histClose">閉じる</button></div>`;
    const close = () => { m.hidden = true; m.innerHTML = ''; };
    $('#histClose').onclick = close; m.onclick = e => { if (e.target === m) close(); };
}

    const row = (key, av, nameHtml, meta) => `<button class="row" data-act="openRoom" data-key="${esc(key)}"><span class="av">${av}</span><span class="rb"><span class="rt">${nameHtml}</span>${meta ? `<span class="rm">${esc(meta)}</span>` : ''}</span>${un(key)}${svg('chev', 16)}</button>`;
    let html = '';
    if (S.me.team) html += `<div class="gh" style="margin-top:4px">チーム</div><div class="list">${row('team', svg('team', 18), esc(S.me.team), '全員')}</div>`;
    if (admin) {   // 管理者：上で選んだチームの「チームチャット」と「メンバー」。全チームでは、未読・管理者・各チームの部屋
        const A = S.adminAll;
        if (!A) return '<div class="empty">読み込み中…</div>';
        const people = A.all.filter(m => !m.is_hidden && m.id !== S.me.id);
        const t = S.viewTeam;
        if (t) {
            const ms = people.filter(m => !m.is_admin && (m.team || '') === (t === '__none__' ? '' : t));
            if (t !== '__none__') html += `<div class="gh" style="margin-top:4px">チームチャット</div><div class="list">${row('t:' + t, svg('team', 18), esc(t), 'メンバー全員に届きます')}</div>`;
            html += `<div class="gh" ${t === '__none__' ? 'style="margin-top:4px"' : ''}>メンバー<span class="n">${ms.length}</span></div>` + (ms.length ? `<div class="list">${ms.map(m => row(m.id, initial(m.name), nameM(m))).join('')}</div>` : '<div class="empty">メンバーがいません</div>');
            return html;
        }
        const unreadPeople = people.filter(m => S.unread[m.id]);
        if (unreadPeople.length) html += `<div class="gh" style="margin-top:4px">未読<span class="n">${unreadPeople.length}</span></div><div class="list">${unreadPeople.map(m => row(m.id, initial(m.name), nameM(m), m.is_admin ? '管理者' : teamLabel(m.team))).join('')}</div>`;
        const ads = people.filter(m => m.is_admin);
        if (ads.length) html += `<div class="gh"${unreadPeople.length ? '' : ' style="margin-top:4px"'}>管理者<span class="n">${ads.length}</span></div><div class="list">${ads.map(m => row(m.id, initial(m.name), nameM(m))).join('')}</div>`;
        if (A.list.length) html += `<div class="gh"${unreadPeople.length || ads.length ? '' : ' style="margin-top:4px"'}>全チームのチャット<span class="n">${A.list.length}</span></div><div class="list">${A.list.map(([tn, n]) => row('t:' + tn, svg('team', 18), esc(tn), `${n}人`)).join('')}</div>`;
        return html + '<div class="hint" style="margin:14px 4px">個別のメッセージは、上のチーム名をタップして、チームを選ぶと、メンバーの一覧が出ます。</div>';
    }
    // 一般のメンバー：同じチームの人と、管理者にだけ連絡できる
    const others = visMembers().filter(m => m.id !== S.me.id);
    if (S.me.team) html += `<div class="gh">個別<span class="n">${others.length}</span></div>` + (others.length ? `<div class="list">${others.map(m => row(m.id, initial(m.name), nameM(m))).join('')}</div>` : '<div class="empty">ほかのメンバーがいません</div>');
    const admins = (S.admins || []).filter(a => a.id !== S.me.id && !others.some(o => o.id === a.id));
    if (admins.length) html += `<div class="gh">管理者<span class="n">${admins.length}</span></div><div class="list">${admins.map(a => row(a.id, initial(a.name), nameM(a), 'いつでも連絡できます')).join('')}</div>`;
    return html || '<div class="empty"><b>連絡できる相手がいません</b>チームに参加すると、チームの人と連絡できます</div>';
}

function csvCell(v){
    let x = String(v ?? '');
    if (/^[=+\-@\t\r]/.test(x)) x = "'" + x; // Excelで数式として実行されないように
    return '"' + x.replace(/"/g, '""') + '"';
}
async function download(){
    const from = $('#dlFrom').value, to = $('#dlTo').value;
    if (!from || !to || from > to) { toast('日付の範囲を確認してください'); return; }
    if (IS_ADMIN() && !S.viewTeam) { toast('タスク・記録タブで、チームを選んでください'); return; }
    S.dl.from = from; S.dl.to = to;
    const btn = document.querySelector('[data-act="download"]'); btn.disabled = true; btn.textContent = '作成中…';
    try {
        const who = inMembers();
        const [logs, notes] = await Promise.all([
            API.all('lab_logs', { member_id: who, and: `(log_date.gte.${from},log_date.lte.${to})`, order: 'log_date.asc,created_at.asc' }),
            API.all('lab_notes', { member_id: who, and: `(note_date.gte.${from},note_date.lte.${to})`, order: 'note_date.asc,created_at.asc' })
        ]);
        if (!S.tasks.length) await loadTasks();
        const tmap = new Map(S.tasks.map(t => [t.id, t]));
        const st = { open: '進行中', done: '完了', dropped: '破棄' };
        let rows = [
            ...logs.map(l => { const t = tmap.get(l.task_id) || {}; return { date: l.log_date, at: l.created_at, kind: KIND[l.kind] || l.kind, task: t.title || '', assignee: memName(t.assignee_id), author: memName(l.member_id), body: l.body, due: t.due_date || '', state: st[t.status] || '', edited: (l.edit_history || []).length > 0, authorId: l.member_id, assigneeId: t.assignee_id }; }),
            ...notes.map(n => ({ date: n.note_date, at: n.created_at, kind: 'メモ', task: '', assignee: '', author: memName(n.member_id), body: n.body, due: '', state: '', edited: (n.edit_history || []).length > 0, authorId: n.member_id, assigneeId: null }))
        ];
        if (!IS_ADMIN() && S.dl.scope === 'me') rows = rows.filter(r => r.authorId === S.me.id || r.assigneeId === S.me.id);
        rows.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.at < b.at ? -1 : 1));
        const head = ['日付', '時刻', '種別', 'タスク', '担当者', '記入者', '内容', '期限', 'タスクの状態', '編集済み'];
        const lines = [head.map(csvCell).join(',')].concat(rows.map(r =>
            [r.date, fmtHM(r.at), r.kind, r.task, r.assignee, r.author, r.body, r.due, r.state, r.edited ? '済' : ''].map(csvCell).join(',')));
        const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `研究記録_${teamLabel(curTeamName())}_${from.replace(/-/g, '')}-${to.replace(/-/g, '')}.csv`;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        toast(`${rows.length}件をダウンロードしました`);
    } catch (e) { handleErr(e); }
    btn.disabled = false; btn.textContent = 'ダウンロード';
}

/* 記録・タスクは個人に属する：今のチームのメンバーの分を表示する（チームを移ると、過去の分ごとついてくる） */
const teamLabel = t => (!t || t === '__none__') ? '所属なし' : t;
const memberIds = () => { const ids = S.members.map(m => m.id); return ids.includes(S.me.id) ? ids : [...ids, S.me.id]; };
const inMembers = () => `in.(${memberIds().join(',')})`;
async function loadMembers(){
    if (IS_ADMIN()) {   // 管理者：選んだチームのメンバー
        const t = S.viewTeam;
        S.members = !t ? [] : t === '__none__' ? (await API.list('lab_members', { team: 'eq.', order: 'created_at.asc' })).filter(m => !m.is_admin)
                                              : await API.list('lab_members', { team: 'eq.' + t, order: 'created_at.asc' });
    } else {
        S.members = S.me.team ? await API.list('lab_members', { team: 'eq.' + S.me.team, order: 'created_at.asc' })
                              : await API.list('lab_members', { id: 'eq.' + S.me.id });   // 所属なし：自分だけ
    }
    noteNames(S.members);
}
async function loadTasks(){ S.tasks = S.members.length || !IS_ADMIN() ? await API.all('lab_tasks', { assignee_id: inMembers(), order: 'created_at.desc' }) : []; }
/* 他の端末でチームや名前が変わったときに、この端末の情報を合わせる */
function adoptMe(m){
    const nm = meFrom(m);
    const changed = nm.team !== S.me.team || nm.admin !== S.me.admin;
    S.me = nm; ls.set('lab_me', S.me);
    if (!changed) return;
    S.members = []; S.tasks = []; S.logs = {}; S.memoData = { notes: [], logs: [] }; S.memoLoaded = false;
    S.unread = {}; S.newIds = new Set(); S.teamFilter = 'all'; S.sheets = [];
    ls.del('lab_cache'); $('#sheet').hidden = true; $('#sheet').innerHTML = '';
}
/* 管理者：チーム一覧を読み込む（タスク・記録で選ぶチーム） */
const viewTeamList = () => [...S.teamNames, ...(S.adminAll && S.adminAll.all.some(m => !m.team && !m.is_admin && !m.is_hidden) ? ['__none__'] : [])];
async function loadAdminBase(){
    const t = await fetchTeams(); S.adminAll = t; S.teamNames = t.list.map(([n]) => n);
    if (S.viewTeam && !viewTeamList().includes(S.viewTeam)) S.viewTeam = '';
    if (!S.viewTeam && S.tab === 'memo' && viewTeamList().length) S.viewTeam = viewTeamList()[0];
}
/* 管理者：チームの選択（画面下から出る縦スクロールの一覧。現在のチームにチェック） */
function teamPickOptions(){
    const at = S.at.loaded ? S.at.teams : [];
    const unread = v => (S.adminAll ? S.adminAll.all : []).filter(m => !m.is_admin && (m.team || '') === (v === '__none__' ? '' : v)).reduce((a, m) => a + (S.unread[m.id] || 0), 0);
    const opts = [];
    if (S.tab !== 'memo') opts.push({ v: '', label: '全チーム', meta: `${S.teamNames.length}チーム`, un: Object.values(S.unread).reduce((a, b) => a + b, 0) });
    viewTeamList().forEach(v => {
        const t = at.find(x => x.name === (v === '__none__' ? '' : v));
        opts.push({ v, label: teamLabel(v), meta: t ? `${t.members.filter(m => !m.is_hidden).length}人 · 進行中 ${t.open}${t.overdue ? ` · 期限切れ ${t.overdue}` : ''}` : '', un: unread(v) });
    });
    return opts;
}
function openTeamPicker(){
    const m = $('#modal'); m.hidden = false;
    const many = viewTeamList().length > 7;
    const list = q => teamPickOptions().filter(o => !q || o.label.includes(q)).map(o => `<button class="row ${S.viewTeam === o.v ? 'sel' : ''}" data-pick="${esc(o.v)}"><span class="av">${o.v === '' ? svg('team', 18) : initial(o.label)}</span><span class="rb"><span class="rt">${esc(o.label)}</span>${o.meta ? `<span class="rm">${esc(o.meta)}</span>` : ''}</span>${S.tab === 'chat' && o.un ? `<span class="un">${o.un}</span>` : ''}${S.viewTeam === o.v ? `<span class="ck">${svg('check', 20, 2.6)}</span>` : ''}</button>`).join('') || '<div class="empty">該当するチームがありません</div>';
    m.innerHTML = `<div class="dlg pick"><h2>チームを選択</h2>${many ? '<input id="pickQ" class="inp" placeholder="チーム名で絞り込み" autocomplete="off" style="margin-top:10px">' : ''}<div class="list" id="pickList" style="margin-top:10px">${list('')}</div><button class="btn gray" id="pickClose" style="margin-top:12px">閉じる</button></div>`;
    const close = () => { m.hidden = true; m.innerHTML = ''; m.onclick = null; };
    const sel = m.querySelector('.row.sel'); if (sel) sel.scrollIntoView({ block: 'center' });
    m.onclick = e => {
        if (e.target === m || e.target.id === 'pickClose') return close();
        const b = e.target.closest('[data-pick]'); if (!b) return;
        const v = b.dataset.pick; close();
        if (v !== S.viewTeam) setViewTeam(v);
    };
    const q = $('#pickQ'); if (q) q.oninput = () => { $('#pickList').innerHTML = list(q.value.trim()); };
    if (!S.at.loaded) loadAdminTeams().then(() => { const pl = $('#pickList'); if (pl && !m.hidden) pl.innerHTML = list(q ? q.value.trim() : ''); });
}
async function setViewTeam(name){
    ls.set('lab_view_team', name);
    S.viewTeam = name; S.members = []; S.tasks = []; S.logs = {}; S.memoData = { notes: [], logs: [] }; S.memoLoaded = false;
    render();
    try {
        if (!name) { await loadAdminTeams(); render(); return; }
        await loadMembers(); await loadTasks(); render();
        if (S.tab === 'memo') loadMemo();
    } catch (e) { handleErr(e); }
}
function adminAuthFailed(){
    ls.del('lab_admin_hash');
    toast('管理者パスワードが確認できません。アカウントを選び直してください', 5000);
    switchAccount(true);
}
function saveCache(){ if (IS_ADMIN()) return; ls.set('lab_cache', { team: S.me.team, members: S.members, tasks: S.tasks }); }
function updateNew(){
    const key = 'lab_seen_' + S.me.id;
    const mine = S.tasks.filter(t => t.assignee_id === S.me.id && t.status === 'open');
    let seen = ls.get(key);
    if (!seen) { seen = mine.map(t => t.id); ls.set(key, seen); }
    S.newIds = new Set(mine.filter(t => !seen.includes(t.id)).map(t => t.id));
}
function markSeen(id){
    const key = 'lab_seen_' + S.me.id; const seen = ls.get(key, []);
    if (!seen.includes(id)) { seen.push(id); ls.set(key, seen.slice(-500)); }
    S.newIds.delete(id);
}
async function refreshAll(){
    try {
        const self = (await API.list('lab_members', { id: 'eq.' + S.me.id }))[0];
        if (!self) {
            // RLSでは間違ったパスワードだと「空」が返るだけ（エラーにならない）。先にパスワードを確認する
            if ((await API.rpc('lab_check')) !== true) throw Object.assign(new Error('パスワードが確認できません'), { status: 401 });
            toast('登録が見つかりません。アカウントを選び直してください', 4000); switchAccount(true); return;
        }
        if (self.is_hidden) { toast('このアカウントは使えなくなっています。管理者に連絡してください', 5000); switchAccount(true); return; }
        const st = self.is_admin ? '' : self.team;
        if (st !== S.me.team || self.name !== S.me.name || !!self.is_admin !== !!S.me.admin) { adoptMe(self); render(); }
        if (IS_ADMIN()) {
            if (!S.admin) { switchAccount(true); return; }
            if ((await API.rpc('lab_admin_check')) !== true) { adminAuthFailed(); return; }
            await loadAdminBase();
            if (S.tab === 'tasks' && !S.viewTeam) await loadAdminTeams();
        }
        await loadMembers();
        await loadTasks();
        saveCache(); updateNew();
        softRender();
        if (S.tab === 'memo') loadMemo();
    } catch (e) { handleErr(e, true); }
}
async function loadLogs(id){
    try {
        S.logs[id] = await API.list('lab_logs', { task_id: 'eq.' + id, order: 'log_date.desc,created_at.desc' });
        const top = S.sheets[S.sheets.length - 1];
        if (top && top.type === 'task' && top.id === id) renderSheet();
    } catch (e) { handleErr(e); }
}

/* ============================================================
   シート（全画面の重ね表示）＋ 戻るボタン対応
   ============================================================ */
function pushSheet(s){ S.sheets.push(s); history.pushState({ n: S.sheets.length }, ''); renderSheet(); }
function closeSheet(){ if (S.sheets.length) history.back(); }
window.addEventListener('popstate', () => {
    if (!S.sheets.length) return;
    const s = S.sheets.pop();
    if (s.type === 'room') stopRoom();
    renderSheet();
    if (!S.sheets.length) { render(); if (S.tab === 'memo') loadMemo(); }
});
function renderSheet(){
    const el = $('#sheet');
    const top = S.sheets[S.sheets.length - 1];
    if (!top) { el.hidden = true; el.innerHTML = ''; return; }
    // 入力途中の文字を保持（背景の再描画で消えないように）
    const keep = {};
    el.querySelectorAll('input[id],textarea[id],select[id]').forEach(x => { keep[x.id] = x.value; });
    el.hidden = false;
    let inner = '';
    if (top.type === 'task') inner = sheetTask(top);
    else if (top.type === 'form') inner = sheetForm(top);
    else if (top.type === 'room') inner = sheetRoom();
    else if (top.type === 'admin') inner = sheetAdmin();
    else if (top.type === 'team') inner = sheetTeam();
    else if (top.type === 'admteams') inner = sheetAdminTeams();
    else if (top.type === 'teamview') inner = sheetTeamView(top);
    el.innerHTML = `<div class="sheet-in">${inner}</div>`;
    Object.entries(keep).forEach(([id, v]) => { const x = el.querySelector('#' + id); if (x && v !== '' && x.tagName !== 'SELECT') x.value = v; });
    if (top.type === 'room') { const m = $('#msgs'); if (m) m.scrollTop = m.scrollHeight; }
}
const sheetHead = (title, right) => `<div class="top sh"><button class="icon-btn" data-act="back" aria-label="戻る">${svg('back', 22)}</button><div class="tw"><h1>${title}</h1></div>${right || ''}</div>`;

/* ---------- タスク詳細 ---------- */
function curTask(){ const s = S.sheets.find(x => x.type === 'task'); return s && findTask(s.id); }
function sheetTask(top){
    const t = findTask(top.id);
    if (!t) return sheetHead('タスク') + `<div class="sheet-body"><div class="empty"><b>タスクが見つかりません</b></div></div>`;
    const di = dueInfo(t); const logs = S.logs[t.id];
    const stPill = { open: '<span class="pill open">進行中</span>', done: '<span class="pill done">完了</span>', dropped: '<span class="pill dropped">破棄</span>' }[t.status];
    let tl = '';
    if (!logs) tl = '<div class="empty">読み込み中…</div>';
    else if (!logs.length) tl = '<div class="empty">履歴はありません</div>';
    else {
        let last = '';
        tl = logs.map(l => {
            const dstr = l.log_date !== last ? fmtM(l.log_date) : ''; last = l.log_date;
            return `<div class="tl"><div class="tl-d">${dstr}</div><div class="tl-b"><div class="eh"><span class="k k-${l.kind}">${KIND[l.kind] || l.kind}</span><b class="nm">${nameH(l.member_id)}</b>${recTools(l, 'log')}</div>${l.body ? `<div class="tx">${esc(l.body)}</div>` : ''}</div></div>`;
        }).join('');
    }
    const viewOnly = IS_ADMIN() || !S.tasks.includes(t);   // 管理者が見ている他チームのタスクは閲覧のみ
    const actions = viewOnly ? '' : t.status === 'open' ? `
        <div class="card" style="margin-top:12px"><textarea id="noteText" class="inp" rows="2" placeholder="進捗メモ（やったこと・結果・次にやること）"></textarea>
          <div class="comp-row"><input class="inp" type="date" id="noteDate" value="${today()}"><button class="btn" data-act="addNote">記録</button></div></div>
        <div class="row2" style="margin-top:0"><button class="btn ok" data-act="finish" data-kind="done">完了にする</button><button class="btn ghost bad" data-act="finish" data-kind="drop">破棄</button></div>`
        : `<button class="btn ghost" style="margin-top:12px" data-act="reopen">進行中に戻す</button>`;
    return sheetHead('タスク', viewOnly ? '' : `<button class="icon-btn" data-act="editTask" data-id="${t.id}" aria-label="編集">${svg('edit', 20)}</button>`) + `<div class="sheet-body">
        <div class="dt-t">${esc(t.title)}</div>
        <div class="dt-tags">${stPill}${t.status === 'open' && t.due_date ? `<span class="pill ${di.cls}">${esc(dueText(t))}</span>` : ''}</div>
        <div class="list">
          <div class="prow"><span>担当</span><b>${nameH(t.assignee_id)}</b></div>
          <div class="prow"><span>期限</span><b>${t.due_date ? fmtMD(t.due_date) : 'なし'}</b></div>
          <div class="prow"><span>依頼</span><b>${nameH(t.created_by)}</b></div>
          <div class="prow"><span>作成</span><b>${fmtMD(isoDate(t.created_at))}</b></div></div>
        ${t.detail ? `<div class="detail">${esc(t.detail)}</div>` : ''}
        ${actions}
        <div class="gh">履歴${logs ? `<span class="n">${logs.length}</span>` : ''}</div><div class="list">${tl}</div></div>`;
}
async function openTask(id){
    if (!findTask(id)) return;
    markSeen(id); renderTabbar();
    pushSheet({ type: 'task', id });
    loadLogs(id);
}
/* 履歴を1件追加（画面に先に反映して、あとから保存） */
function logAdd(taskId, kind, body, date){
    const row = { id: uuid(), team: S.me.team, task_id: taskId, member_id: S.me.id, kind, body: body || '', log_date: date || today() };
    if (S.logs[taskId]) { S.logs[taskId].unshift({ ...row, created_at: new Date().toISOString() }); S.logs[taskId].sort((a, b) => a.log_date < b.log_date ? 1 : a.log_date > b.log_date ? -1 : (a.created_at < b.created_at ? 1 : -1)); }
    return API.insert('lab_logs', row).catch(e => { if (S.logs[taskId]) S.logs[taskId] = S.logs[taskId].filter(l => l.id !== row.id); renderSheet(); throw e; });
}
async function addNote(){
    const t = curTask(); const ta = $('#noteText'); const body = ta.value.trim();
    if (!body) { toast('進捗メモを書いてください'); return; }
    const date = $('#noteDate').value || today();
    ta.value = '';
    try { const p = logAdd(t.id, 'note', body, date); renderSheet(); await p; toast('記録しました'); }
    catch (e) { renderSheet(); if ($('#noteText')) $('#noteText').value = body; handleErr(e); }
}
async function finish(kind){
    const t = curTask(); if (!t) return;
    const isDone = kind === 'done';
    const r = await askBox({
        title: isDone ? 'タスクを完了にする' : 'タスクを破棄',
        desc: t.title, placeholder: isDone ? '結果・ひとこと（任意）' : '破棄する理由（任意）',
        ok: isDone ? '完了にする' : '破棄', danger: !isDone, date: today(), dateLabel: isDone ? '完了した日' : '破棄した日'
    });
    if (!r) return;
    const prev = { ...t };
    t.status = isDone ? 'done' : 'dropped'; t.closed_at = new Date().toISOString(); t.closed_date = r.date;
    try {
        const p = logAdd(t.id, kind, r.text, r.date); renderSheet();
        await API.patch('lab_tasks', t.id, { status: t.status, closed_at: t.closed_at, closed_date: r.date });
        await p; saveCache(); toast(isDone ? 'おつかれさま！完了にしました' : '破棄しました');
    } catch (e) { Object.assign(t, prev); renderSheet(); handleErr(e); refreshAll(); }
}
async function reopen(){
    const t = curTask(); if (!t) return;
    if (!(await askBox({ title: '進行中にもどしますか？', desc: t.title, ok: 'もどす', noText: true }))) return;
    const prev = { ...t };
    t.status = 'open'; t.closed_at = null; t.closed_date = null;
    try {
        const p = logAdd(t.id, 'reopen', '', today()); renderSheet();
        await API.patch('lab_tasks', t.id, { status: 'open', closed_at: null, closed_date: null });
        await p; saveCache();
    } catch (e) { Object.assign(t, prev); renderSheet(); handleErr(e); refreshAll(); }
}

/* ---------- タスク作成・編集 ---------- */
function sheetForm(top){
    const t = top.id ? S.tasks.find(x => x.id === top.id) : null;
    const v = t || { title: '', detail: '', assignee_id: top.assignee || S.me.id, due_date: '' };
    const opts = S.members.filter(m => !m.is_hidden || m.id === v.assignee_id).map(m => `<option value="${m.id}" ${m.id === v.assignee_id ? 'selected' : ''}>${esc(m.name)}${m.id === S.me.id ? '（自分）' : ''}${m.is_hidden ? '（非表示）' : ''}</option>`).join('');
    return sheetHead(t ? 'タスク編集' : '新規タスク') + `<div class="sheet-body">
        <label class="l" style="margin-top:0" for="fTitle">タスク名</label>
        <input id="fTitle" class="inp" maxlength="80" placeholder="例：実験結果をまとめる" value="${esc(v.title)}">
        <div class="grid2"><div><label class="l" for="fAssignee">担当</label><select id="fAssignee" class="inp">${opts}</select></div>
          <div><label class="l" for="fDue">期限</label><input id="fDue" class="inp" type="date" value="${v.due_date || ''}"></div></div>
        <div class="quick"><button data-act="quickDue" data-n="0">今日</button><button data-act="quickDue" data-n="1">明日</button><button data-act="quickDue" data-n="7">1週間後</button><button data-act="quickDue" data-n="-1">期限なし</button></div>
        <label class="l" for="fDetail">詳細（任意）</label>
        <textarea id="fDetail" class="inp" rows="3">${esc(v.detail)}</textarea>
        <p class="err" id="ferr" hidden></p>
        <div style="height:14px"></div>
        <button class="btn" data-act="saveTask">${t ? '保存' : '作成'}</button></div>`;
}
async function saveTask(){
    const top = S.sheets[S.sheets.length - 1];
    const title = $('#fTitle').value.trim();
    if (!title) { const e = $('#ferr'); e.textContent = 'タスク名を入れてください'; e.hidden = false; $('#fTitle').focus(); return; }
    const detail = $('#fDetail').value.trim(), assignee = $('#fAssignee').value, due = $('#fDue').value || null;
    const btn = document.querySelector('[data-act="saveTask"]'); btn.disabled = true;
    try {
        if (top.id) {
            const t = S.tasks.find(x => x.id === top.id);
            const patch = {};
            if (title !== t.title) patch.title = title;
            if (detail !== t.detail) patch.detail = detail;
            if (assignee !== t.assignee_id) patch.assignee_id = assignee;
            if (due !== (t.due_date || null)) patch.due_date = due;
            if (Object.keys(patch).length) {
                const oldAssignee = t.assignee_id, oldDue = t.due_date;
                await API.patch('lab_tasks', t.id, patch);
                Object.assign(t, patch);
                const ps = [];
                if ('assignee_id' in patch) ps.push(logAdd(t.id, 'assign', `担当：${memName(oldAssignee)} → ${memName(assignee)}`));
                if ('due_date' in patch) ps.push(logAdd(t.id, 'due', `期限：${oldDue ? fmtMD(oldDue) : 'なし'} → ${due ? fmtMD(due) : 'なし'}`));
                await Promise.all(ps);
                saveCache(); updateNew();
            }
            toast('保存しました');
        } else {
            const row = { id: uuid(), team: S.me.team, title, detail, assignee_id: assignee, created_by: S.me.id, due_date: due, status: 'open' };
            await API.insert('lab_tasks', row);
            S.tasks.unshift({ ...row, closed_at: null, closed_date: null, created_at: new Date().toISOString() });
            if (assignee === S.me.id) markSeen(row.id);
            S.logs[row.id] = [];
            await logAdd(row.id, 'create', `担当：${memName(assignee)}　期限：${due ? fmtMD(due) : 'なし'}`);
            saveCache(); updateNew();
            toast(assignee === S.me.id ? 'タスクを作りました' : `${memName(assignee)}さんにタスクを渡しました`);
        }
        closeSheet();
    } catch (e) { btn.disabled = false; handleErr(e); }
}

/* ---------- チームの作成・参加・移動・脱退・名前変更 ----------
   チームは「メンバーの所属」だけで決まる。記録・タスクは個人に属し、所属が変われば一緒に移る。 */
async function openTeamSheet(){
    S.tm = { loaded: false, mode: 'select', sel: '', teams: [], err: '' };
    pushSheet({ type: 'team' });
    try { S.tm.teams = (await fetchTeams()).list; S.tm.loaded = true; } catch (e) { handleErr(e); S.tm.loaded = true; }
    renderSheet();
}
function sheetTeam(){
    const tm = S.tm, title = S.me.team ? 'チーム変更' : 'チーム参加';
    if (!tm.loaded) return sheetHead(title) + '<div class="sheet-body"><div class="empty">読み込み中…</div></div>';
    const teams = tm.teams.filter(([t]) => t !== S.me.team);
    const isNew = tm.mode === 'new' || !teams.length;
    return sheetHead(title) + `<div class="sheet-body">
      ${S.me.team ? `<p class="hint" style="margin:0 2px 10px">現在のチーム：<b>${esc(S.me.team)}</b></p>` : ''}
      ${teams.length ? `<div class="seg" style="margin-bottom:12px"><button data-act="tmMode" data-v="select" class="${isNew ? '' : 'on'}">チーム選択</button><button data-act="tmMode" data-v="new" class="${isNew ? 'on' : ''}">チーム登録</button></div>` : ''}
      ${isNew ? `<label class="l" for="tNew" style="margin-top:0">新しいチーム名</label><input id="tNew" class="inp" maxlength="20" autocomplete="off">`
              : `<div class="list">${teams.map(([t, n]) => `<button class="row ${tm.sel === t ? 'sel' : ''}" data-act="tmSel" data-team="${esc(t)}"><span class="radio"></span><span class="rb"><span class="rt">${esc(t)}</span></span><span class="cnt">${n}人</span></button>`).join('')}</div>`}
      <p class="err" id="tErr" ${tm.err ? '' : 'hidden'}>${esc(tm.err || '')}</p>
      <p class="hint" style="margin:12px 2px 0">あなたの記録・タスクは、過去の分も含めて一緒に移動します。${S.me.team ? '元のチームからは見えなくなります。' : ''}</p>
      <div style="height:14px"></div><button class="btn" data-act="tmGo">${isNew ? '作成して移動' : '移動'}</button>
      ${isNew ? '<button class="btn ghost" style="margin-top:8px" data-act="tmCreate">作成のみ（自分は移動しない）</button>' : ''}</div>`;
}
async function moveTeam(){

async function loadAdminTeams(){
    try {
        const { all, list } = await fetchTeams();
        const since = addDays(today(), -6);
        const [tasks, notes, logs] = await Promise.all([
            API.all('lab_tasks', { select: 'id,assignee_id,status,due_date' }),
            API.all('lab_notes', { select: 'member_id', note_date: 'gte.' + since }),
            API.all('lab_logs', { select: 'member_id', log_date: 'gte.' + since })
        ]);
        const teamOf = {}; all.forEach(m => { teamOf[m.id] = m.team; });
        const mk = (name, members) => ({ name, members, open: 0, overdue: 0, done: 0, recent: 0 });
        const rows = list.map(([name]) => mk(name, all.filter(m => m.team === name)));
        const none = all.filter(m => !m.team && !m.is_admin);
        if (none.length) rows.push(mk('', none));
        const byName = Object.fromEntries(rows.map(r => [r.name, r]));
        tasks.forEach(t => { const r = byName[teamOf[t.assignee_id]]; if (!r) return; if (t.status === 'open') { r.open++; if (t.due_date && t.due_date < today()) r.overdue++; } else if (t.status === 'done') r.done++; });
        [...notes, ...logs].forEach(x => { const r = byName[teamOf[x.member_id]]; if (r) r.recent++; });
        S.at = { loaded: true, teams: rows };
    } catch (e) { handleErr(e); S.at = { loaded: true, teams: [] }; }
}

const readMap = () => ls.get('lab_read_' + S.me.id);
function setRead(key, ts){

const isTeamRoom = key => key === 'team' || key.startsWith('t:');
const roomTeam = key => key === 'team' ? S.me.team : key.slice(2);
function roomName(key){ return isTeamRoom(key) ? roomTeam(key) : memName(key); }

function msgsHTML(){
    const r = S.room; if (!r) return '';
    if (!r.loaded) return '<div class="empty">読み込み中…</div>';
    if (!r.msgs.length) return '<div class="empty"><b>メッセージはありません</b></div>';
    let last = '';
    return r.msgs.map(m => {
        const d = isoDate(m.created_at); let sep = '';
        if (d !== last) { sep = `<div class="dsep">${fmtLong(d)}</div>`; last = d; }
        const mine = m.sender_id === S.me.id;
        return sep + `<div class="msg ${mine ? 'me' : 'you'} ${m._pending ? 'pending' : ''}">
            ${!mine && isTeamRoom(r.key) ? `<div class="info">${nameH(m.sender_id)}</div>` : ''}
            <div class="bub">${esc(m.body)}</div><div class="info">${fmtHM(m.created_at)}</div></div>`;
    }).join('');

function updateMsgs(force){
    const el = $('#msgs'); if (!el) return;
    const near = el.scrollHeight - el.scrollTop - el.clientHeight < 140;
    el.innerHTML = msgsHTML();
    if (near || force) el.scrollTop = el.scrollHeight;
}
function roomQueries(key, extra){
    if (isTeamRoom(key)) return [{ team: 'eq.' + roomTeam(key), to_id: 'is.null', ...extra }];
    return [{ sender_id: 'eq.' + S.me.id, to_id: 'eq.' + key, ...extra }, { sender_id: 'eq.' + key, to_id: 'eq.' + S.me.id, ...extra }];
}
async function pollRoom(initial){
    const r = S.room; if (!r) return;
    try {
        let extra;
        if (initial) extra = { order: 'created_at.desc', limit: 100 };
        else extra = { order: 'created_at.asc', created_at: 'gt.' + new Date(Date.parse(r.lastTs) - 5000).toISOString() };
        const res = await Promise.all(roomQueries(r.key, extra).map(q => API.list('lab_messages', q)));
        if (S.room !== r) return;
        const fresh = res.flat();
        const byId = new Map(r.msgs.filter(m => !m._pending).map(m => [m.id, m]));
        fresh.forEach(m => byId.set(m.id, m));
        const pend = r.msgs.filter(m => m._pending && !byId.has(m.id));
        r.msgs = [...byId.values()].sort((a, b) => a.created_at < b.created_at ? -1 : 1).slice(-200).concat(pend);
        const real = r.msgs.filter(m => !m._pending);
        const before = r.loaded; const cnt = r.msgs.length;
        r.loaded = true;
        if (real.length) { r.lastTs = real[real.length - 1].created_at; setRead(r.key, r.lastTs); }
        else if (!r.lastTs) r.lastTs = new Date(Date.now() - 864e5).toISOString();
        if (initial || !before || cnt !== r._cnt) { r._cnt = cnt; updateMsgs(initial); }
    } catch (e) { handleErr(e, true); }
}
function openRoom(key){
    S.room = { key, msgs: [], loaded: false, lastTs: null };
    pushSheet({ type: 'room', key });
    pollRoom(true);
    clearInterval(S.roomTimer);
    S.roomTimer = setInterval(() => { if (!document.hidden && S.room) pollRoom(false); }, 6000);
}
function stopRoom(){ clearInterval(S.roomTimer); S.room = null; checkUnread(); }
async function sendMsg(){
    const r = S.room; const ta = $('#msgText'); const body = ta.value.trim();
    if (!r || !body) return;
    ta.value = ''; ta.style.height = '';
    const m = { id: uuid(), team: isTeamRoom(r.key) ? roomTeam(r.key) : S.me.team, sender_id: S.me.id, to_id: isTeamRoom(r.key) ? null : r.key, body };
    r.msgs.push({ ...m, created_at: new Date().toISOString(), _pending: true });
    updateMsgs(true);
    try {
        const res = await API.insert('lab_messages', m, true);
        const i = r.msgs.findIndex(x => x.id === m.id);
        if (i >= 0 && res && res[0]) r.msgs[i] = res[0];
        if (S.room === r) { r.msgs.sort((a, b) => a.created_at < b.created_at ? -1 : 1); updateMsgs(true); }
    } catch (e) {
        r.msgs = r.msgs.filter(x => x.id !== m.id);
        if (S.room === r) { updateMsgs(true); const t2 = $('#msgText'); if (t2) t2.value = body; }
        handleErr(e);
    }
}
/* 未読数（連絡タブのバッジ） */
async function checkUnread(){
    if (!S.me || !S.pass) return;
    try {
        const since = new Date(Date.now() - 14 * 864e5).toISOString();
        const [dm0, tm] = await Promise.all([
            API.list('lab_messages', { select: 'sender_id,to_id,created_at', to_id: 'eq.' + S.me.id, created_at: 'gt.' + since, order: 'created_at.asc', limit: 500 }),
            S.me.team ? API.list('lab_messages', { select: 'sender_id,to_id,created_at', team: 'eq.' + S.me.team, to_id: 'is.null', sender_id: 'neq.' + S.me.id, created_at: 'gt.' + since, order: 'created_at.asc', limit: 500 }) : Promise.resolve([])
        ]);
        // 連絡できるのは、同じチームの人と管理者だけ。それ以外の送り主は数えない
        await loadAdmins();
        const allowed = new Set([...visMembers().map(m => m.id), ...S.admins.map(a => a.id)]);
        const dm = IS_ADMIN() ? dm0 : dm0.filter(m => allowed.has(m.sender_id));
        const all = [...dm.map(m => ({ key: m.sender_id, at: m.created_at })), ...tm.map(m => ({ key: 'team', at: m.created_at }))];
        let rm = readMap();
        if (!rm) { // 初回は「いままでのメッセージは既読」として基準を作る
            rm = {}; all.forEach(m => { if (!rm[m.key] || m.at > rm[m.key]) rm[m.key] = m.at; });
            ls.set('lab_read_' + S.me.id, rm);
        }
        const u = {};
        all.forEach(m => { if (!rm[m.key] || Date.parse(m.at) > Date.parse(rm[m.key])) u[m.key] = (u[m.key] || 0) + 1; });
        if (S.room) delete u[S.room.key];
        S.unread = u;
        renderTabbar();
        if (S.tab === 'chat' && !S.sheets.length && !typing()) render();
    } catch (e) { handleErr(e, true); }
}

/* ============================================================
   ダイアログ
   ============================================================ */
function askBox({ title, desc, placeholder, ok = 'OK', danger, date, dateLabel, noText, input, text, required }){
    return new Promise(resolve => {
        const m = $('#modal'); m.hidden = false;
        m.innerHTML = `<div class="dlg"><h2>${esc(title)}</h2>${desc ? `<p class="hint" style="margin:0 0 4px">${esc(desc)}</p>` : ''}
          ${noText ? '' : input ? `<input id="dlgText" class="inp" type="${input}" autocomplete="off" autocapitalize="off" style="margin-top:10px" placeholder="${esc(placeholder || '')}" value="${esc(text || '')}">`
                                    : `<textarea id="dlgText" class="inp" style="margin-top:10px" placeholder="${esc(placeholder || '')}">${esc(text || '')}</textarea>`}
          ${date ? `<label class="l" for="dlgDate">${esc(dateLabel || '日付')}</label><input id="dlgDate" class="inp" type="date" value="${date}">` : ''}
          <p class="err" id="dlgErr" hidden>内容を入力してください</p>
          <div class="row2" style="margin-top:14px"><button class="btn gray" id="dlgNo">キャンセル</button><button class="btn ${danger ? 'bad' : ''}" id="dlgOk">${esc(ok)}</button></div></div>`;
        const done = v => { m.hidden = true; m.innerHTML = ''; resolve(v); };
        $('#dlgNo').onclick = () => done(null);
        if (input) $('#dlgText').onkeydown = e => { if (e.key === 'Enter') $('#dlgOk').click(); };
        $('#dlgOk').onclick = () => {
            const v = noText ? '' : $('#dlgText').value.trim();
            if (required && !v) { $('#dlgErr').hidden = false; return; }
            done({ text: v, date: date ? ($('#dlgDate').value || date) : null });
        };
        m.onclick = e => { if (e.target === m) done(null); };
    });
}

/* ============================================================
   イベント
   ============================================================ */
document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const a = el.dataset.act, v = el.dataset.v;
    switch (a) {
        case 'tab': S.tab = v; render(); $('#main').scrollTop = 0;
            if (v === 'memo') { if (IS_ADMIN() && !S.viewTeam && viewTeamList().length) setViewTeam(viewTeamList()[0]); else { S.memoLoaded = false; render(); loadMemo(); } }
            if (v === 'tasks' && IS_ADMIN() && !S.viewTeam) loadAdminTeams().then(() => render());
            if (v === 'chat') { checkUnread(); if (IS_ADMIN()) loadAdminChat(); }
            if (v === 'tasks') refreshAll();
            break;
        case 'status': S.taskStatus = v; render(); break;
        case 'filter': S.teamFilter = v; render(); break;
        case 'reload': refreshAll(); checkUnread(); if (S.tab === 'memo') loadMemo(); toast('更新しました', 1200); break;
        case 'newTask': pushSheet({ type: 'form', assignee: S.me.id }); break;
        case 'editTask': pushSheet({ type: 'form', id: el.dataset.id }); break;
        case 'openTask': openTask(el.dataset.id); break;
        case 'back': closeSheet(); break;
        case 'quickDue': { const n = +el.dataset.n; $('#fDue').value = n < 0 ? '' : addDays(today(), n); break; }
        case 'saveTask': saveTask(); break;
        case 'addNote': addNote(); break;
        case 'finish': finish(el.dataset.kind); break;
        case 'reopen': reopen(); break;
        case 'memoShift': setMemoDate(addDays(S.memoDate, +v * MEMO_SPAN[S.memoMode])); break;
        case 'memoMode': setMemoMode(v); break;
        case 'memoGo': S.memoMode = 'day'; setMemoDate(el.dataset.d); $('#main').scrollTop = 0; break;
        case 'editRec': editRec(el.dataset.t, el.dataset.id); break;
        case 'hist': showHistory(el.dataset.t, el.dataset.id); break;
        case 'memoToday': setMemoDate(today()); break;
        case 'memoScope': S.memoScope = v; render(); break;
        case 'addMemo': addMemo(); break;
        case 'delMemo': delMemo(el.dataset.id); break;
        case 'openRoom': openRoom(el.dataset.key); break;
        case 'send': sendMsg(); break;
        case 'dlScope': S.dl.scope = v; S.dl.from = $('#dlFrom').value || S.dl.from; S.dl.to = $('#dlTo').value || S.dl.to; render(); break;
        case 'download': download(); break;
        case 'theme': ls.set('lab_theme', v); applyTheme(v); render(); break;
        case 'admOpen': openAdmin(); break;
        case 'admHide': admHide(el.dataset.id, el.dataset.v === '1'); break;
        case 'teamOpen': openTeamSheet(); break;
        case 'tmCreate': createTeamOnly(); break;
        case 'admTeams': openAdminTeams(); break;
        case 'atOpen': openTeamView(el.dataset.team); break;
        case 'atCreate': adminCreateTeam(); break;
        case 'tvRename': adminRenameTeam(el.dataset.team); break;
        case 'tvDelete': deleteTeam(el.dataset.team); break;
        case 'tvChat': openRoom('t:' + el.dataset.team); break;
        case 'tvDm': openRoom(el.dataset.id); break;
        case 'tmMode': S.tm.mode = v; S.tm.err = ''; renderSheet(); break;
        case 'tmSel': S.tm.sel = el.dataset.team; S.tm.err = ''; renderSheet(); break;
        case 'tmGo': moveTeam(); break;
        case 'teamLeave': leaveTeam(); break;
        case 'teamRename': renameTeam(); break;
        case 'rename': renameMe(); break;
        case 'switchAcc': switchAccount(); break;
        case 'forgetPw': forgetPassword(); break;
        case 'regStart': OB.kind = 'member'; OB.name = ''; OB.team = ''; OB.newTeam = ''; OB.mode = 'select'; renderRegName(); break;
        case 'regAdmin': OB.kind = 'admin'; OB.name = ''; renderRegName(); break;
        case 'vt': setViewTeam(el.dataset.team); break;
        case 'teamPick': openTeamPicker(); break;
        case 'obAccounts': renderAccounts(); break;
        case 'obName': renderRegName(); break;
        case 'obMode': { const t = $('#rTeam'); if (t) OB.newTeam = t.value; OB.mode = v; renderRegTeam(); break; }
        case 'obTeam': OB.team = el.dataset.team; renderRegTeam(); break;
        case 'pickMe': { const b = el; enterAs(b.dataset.id); break; }
    }
});
document.addEventListener('change', e => {
    if (e.target.id === 'memoDate') setMemoDate(e.target.value);
    if (e.target.id === 'showPw') $('#pw').type = e.target.checked ? 'text' : 'password';
    if (e.target.id === 'showApw') $('#apw').type = e.target.checked ? 'text' : 'password';
});
document.addEventListener('input', e => {
    if (e.target.id === 'msgText') { const t = e.target; t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 130) + 'px'; }
});

async function enterAs(id){
    try {
        const all = await API.list('lab_members', { id: 'eq.' + id });
        if (!all[0]) return;
        if (all[0].is_admin && !(await ensureAdminAccess())) return;
        setMe(all[0]);
    } catch (e) { handleErr(e); }
}
async function renameMe(){
    const r = await askBox({ title: '名前を変える', ok: '変更する', placeholder: S.me.name });
    if (!r || !r.text) return;
    try {
        await API.patch('lab_members', S.me.id, { name: r.text });
        S.me.name = r.text; ls.set('lab_me', S.me);
        const m = mem(S.me.id); if (m) m.name = r.text;
        saveCache(); render(); toast('名前を変えました');
    } catch (e) { handleErr(e); }
}
function resetSession(){
    stopTimers(); S.me = null; S.sheets = []; S.admin = null; S.viewTeam = ''; S.teamNames = [];
    $('#sheet').hidden = true; $('#sheet').innerHTML = '';
}
/* アカウント切替：パスワードは端末に残す（毎回入力しなくてよい） */
async function switchAccount(force){
    if (!force && !(await askBox({ title: 'アカウントを切り替えますか？', desc: 'アカウント選択に戻ります。記録は消えません。', ok: '切り替える', noText: true }))) return;
    ['lab_me', 'lab_cache'].forEach(ls.del);
    resetSession();
    enterWho();
}
/* パスワード削除：この端末に保存したパスワードを消す（次回は入力が必要） */
function forgetPassword(){
    ['lab_pass', 'lab_me', 'lab_cache', 'lab_admin_hash'].forEach(ls.del);
    S.pass = null; resetSession();
    renderLogin();
}

/* ---------- 自動更新 ---------- */
let pollTimer;
function startTimers(){
    stopTimers();
    pollTimer = setInterval(() => {
        if (document.hidden || !S.me) return;
        if (!S.sheets.length) refreshAll();
        checkUnread();
    }, 20000);
}
function stopTimers(){ clearInterval(pollTimer); clearInterval(S.roomTimer); }
document.addEventListener('visibilitychange', () => {
    if (!document.hidden && S.me && S.pass) { refreshAll(); checkUnread(); if (S.room) pollRoom(false); }
});
/* キーボードが出てもシートが隠れないように（iPhone/Android共通） */
if (window.visualViewport) {
    const fit = () => {
        const sh = $('#sheet'); if (!sh) return;
        sh.style.height = window.visualViewport.height + 'px';
        sh.style.transform = `translateY(${window.visualViewport.offsetTop}px)`;
        const m = $('#msgs'); if (m && !sh.hidden) m.scrollTop = m.scrollHeight;
    };
    window.visualViewport.addEventListener('resize', fit);
    window.visualViewport.addEventListener('scroll', fit);
}

/* ---------- 起動 ---------- */
(async function boot(){
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
    if (!CONFIGURED) { renderSetupNeeded(); return; }
    S.pass = ls.get('lab_pass'); S.me = ls.get('lab_me');
    if (!S.pass) { renderLogin(); return; }
    if (!S.me) { enterWho(); return; }
    useSavedMe(S.me);
})();
</script>
